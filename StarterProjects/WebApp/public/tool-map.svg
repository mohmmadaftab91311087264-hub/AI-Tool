<svg xmlns="http://www.w3.org/2000/svg" width="260" height="160" viewBox="0 0 260 160" role="img" aria-labelledby="title desc">
  <title id="title">AI-Tool connected workspace map</title>
  <desc id="desc">A compact network diagram connecting GitHub, VS Code Insiders, SDKs, and Microsoft tools to AI-Tool.</desc>
  <rect width="260" height="160" rx="0" fill="#13221e"/>
  <g fill="none" stroke="#6fd6c8" stroke-width="2">
    <path d="M130 80 55 42"/>
    <path d="M130 80 205 42"/>
    <path d="M130 80 58 121"/>
    <path d="M130 80 202 121"/>
  </g>
  <rect x="94" y="50" width="72" height="60" fill="#e9c46a"/>
  <text x="130" y="77" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#13221e">AI</text>
  <text x="130" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#13221e">Tool</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="11">
    <rect x="22" y="24" width="66" height="36" fill="#ffffff"/>
    <text x="55" y="46" text-anchor="middle" fill="#13221e">GitHub</text>
    <rect x="172" y="24" width="66" height="36" fill="#ffffff"/>
    <text x="205" y="46" text-anchor="middle" fill="#13221e">Insiders</text>
    <rect x="22" y="103" width="72" height="36" fill="#ffffff"/>
    <text x="58" y="125" text-anchor="middle" fill="#13221e">SDKs</text>
    <rect x="166" y="103" width="72" height="36" fill="#ffffff"/>
    <text x="202" y="125" text-anchor="middle" fill="#13221e">DevTools</text>
  </g>
</svg>
